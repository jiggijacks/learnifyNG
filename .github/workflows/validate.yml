name: Validate LearnifyNG
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: node --check script.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/investigate/index.ts
      - name: Check required live-investigation files
        run: |
          test -s config.js
          test -s supabase/functions/investigate/index.ts
          test -s supabase/migrations/202610180001_live_investigation_ledger.sql
          grep -q 'web_search' supabase/functions/investigate/index.ts
          grep -q 'needs_investigation' supabase/functions/investigate/index.ts
          ! grep -q 'service_role' config.js
